name: 🛡️ Site Health & Build Integrity CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Chạy kiểm tra định kỳ lúc 00:00 Chủ Nhật hàng tuần
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  health-check:
    name: System Health & Build Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Update npm to latest (fix TS7 optional-deps EBADPLATFORM)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript & Code Quality
        run: npx tsc --noEmit

      - name: Test 9 RSS Feeds & CMS Health
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run check-status

      - name: Test Next.js Build (optional — production validated by Cloudflare Workers Builds)
        continue-on-error: true
        timeout-minutes: 25
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SITE_URL: https://news-studio.vn002187444.workers.dev
        run: npm run build
