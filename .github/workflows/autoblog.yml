name: AI Autoblogger Cron

on:
  schedule:
    # Chạy tự động dự phòng mỗi 6 tiếng một lần (giảm tải runner, kết hợp event-driven từ Cloudflare Worker)
    - cron: '0 */6 * * *'
  # Nhận tín hiệu kích hoạt tức thì từ Cloudflare Worker RSS Sentinel khi có tin mới
  repository_dispatch:
    types: [autoblog_trigger]
  # Cho phép bấm chạy thủ công trên GitHub UI bất kỳ lúc nào:
  workflow_dispatch:

jobs:
  autoblog:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # Giới hạn 8 phút để chống hao phí runner GitHub
    permissions:
      contents: write # Cấp quyền cho Bot tự động commit code
    defaults:
      run:
        working-directory: frontend # package.json + scripts nằm trong frontend/
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1 # Shallow clone tăng tốc độ checkout 90%
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('frontend/package-lock.json') }}
          
      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit
        
      - name: Run AI Autoblogger Script (Jev Analysis + Gemini Writing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_JEV_MODEL: ${{ secrets.OPENCODE_JEV_MODEL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run autoblog && npm run clean-links && npm run sync-posts

      - name: Generate Autoblog Summary
        run: |
          echo "### 🤖 Kết Quả Lượt Chạy Autoblog" >> $GITHUB_STEP_SUMMARY
          echo "> Thời gian chạy: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          NEW_FILES=$(git status --porcelain src/data/posts/*.mdx | awk '{print $2}' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "**Bài viết mới đã được xuất bản và đồng bộ:**" >> $GITHUB_STEP_SUMMARY
            for f in $NEW_FILES; do
              echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⏩ Không có bài viết mới trong lượt chạy này (tất cả tin mới nhất đều đã được xuất bản trước đó)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push New Articles
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Autoblog Action"
          git add src/data/posts/*.mdx src/data/posts-manifest.json
          
          # Chỉ commit nếu có bài báo mới được sinh ra (tránh báo lỗi empty commit)
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 AI Auto-publish: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "⏩ No new articles to publish."
          fi
