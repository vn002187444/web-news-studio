name = "news-studio"
main = ".open-next/worker.js"
compatibility_date = "2024-11-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

  [observability.logs]
  enabled = true
  invocation_logs = true

  [observability.traces]
  enabled = false
